<!doctype html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}UniCore{% endblock %}</title>
    <style>
        :root { --navy:#14213d; --blue:#2463eb; --sky:#edf4ff; --ink:#172033; --muted:#667085; --line:#e4e7ec; --danger:#b42318; --success:#027a48; }
        * { box-sizing:border-box; } body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f7f8fa; color:var(--ink); }
        a { color:var(--blue); text-decoration:none; } nav { background:var(--navy); color:white; }
        .nav-wrap { max-width:1180px; margin:auto; padding:0 22px; display:flex; align-items:center; min-height:64px; gap:24px; }
        .brand { color:white; font-size:21px; font-weight:800; margin-right:18px; } nav a:not(.brand) { color:#dbe5ff; font-size:14px; }
        .container { max-width:1180px; margin:30px auto; padding:0 22px 60px; }
        .page-head { display:flex; justify-content:space-between; align-items:center; gap:15px; margin-bottom:22px; }
        h1 { font-size:28px; margin:0; } h2 { font-size:19px; margin:0 0 16px; } .muted { color:var(--muted); }
        .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; } .grid.two { grid-template-columns:repeat(2,1fr); }
        .card { background:white; border:1px solid var(--line); border-radius:14px; padding:20px; box-shadow:0 2px 8px rgba(16,24,40,.04); }
        .metric { font-size:32px; font-weight:800; margin-top:8px; } .section { margin-top:24px; } .actions { display:flex; flex-wrap:wrap; gap:8px; }
        .btn { display:inline-block; border:0; border-radius:8px; padding:9px 14px; background:var(--blue); color:white; cursor:pointer; font-size:14px; }
        .btn.secondary { background:white; color:var(--ink); border:1px solid var(--line); } .btn.danger { background:#fff1f0; color:var(--danger); border:1px solid #fecdca; } .btn.small { padding:6px 10px; font-size:13px; }
        table { width:100%; border-collapse:collapse; background:white; } th,td { text-align:left; border-bottom:1px solid var(--line); padding:12px 13px; vertical-align:top; }
        th { color:var(--muted); font-size:13px; background:#fafafa; } tr:last-child td { border-bottom:0; } .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:12px; background:white; }
        .badge { display:inline-block; padding:4px 8px; border-radius:999px; background:var(--sky); color:#1849a9; font-size:12px; } .badge.success { background:#ecfdf3; color:var(--success); }
        .form-card { max-width:720px; margin:auto; } .form-row { margin-bottom:16px; } label { display:block; font-weight:650; margin-bottom:6px; }
        .form-control { width:100%; border:1px solid #cfd4dc; border-radius:8px; padding:10px 11px; background:white; font:inherit; } .errorlist { color:var(--danger); }
        .alert { padding:12px 15px; border-radius:9px; margin-bottom:16px; background:#ecfdf3; color:var(--success); } .alert.error { background:#fff1f0; color:var(--danger); }
        .search { display:flex; gap:8px; max-width:430px; } .empty { padding:28px; text-align:center; color:var(--muted); } .detail-grid { display:grid; grid-template-columns:1fr 2fr; gap:22px; }
        dl { margin:0; } dt { color:var(--muted); font-size:13px; margin-top:12px; } dd { margin:3px 0 0; }
        @media(max-width:800px) { .grid,.grid.two,.detail-grid { grid-template-columns:1fr; } .nav-wrap { flex-wrap:wrap; padding-top:14px; padding-bottom:14px; gap:12px; } .page-head { align-items:flex-start; flex-direction:column; } }
    </style>
</head>
<body>
<nav><div class="nav-wrap">
    <a class="brand" href="{% url 'academics:dashboard' %}">UniCore</a>
    <a href="{% url 'academics:organization' %}">โครงสร้างองค์กร</a>
    <a href="{% url 'academics:student-list' %}">นักศึกษา</a>
    <a href="{% url 'academics:catalog' %}">หลักสูตรและรายวิชา</a>
    <a href="{% url 'academics:open-class-list' %}">Open Classes</a>
    <a href="{% url 'academics:enrollment-create' %}">ลงทะเบียน</a>
    <a href="{% url 'admin:index' %}">Admin</a>
</div></nav>
<main class="container">
    {% for message in messages %}<div class="alert {% if message.tags == 'error' %}error{% endif %}">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
